# ============================================================
#  VoidChunkGenerator - konfiguracja domyslna dla swiatow void.
#  Uzywana dla KAZDEGO swiata z bukkit.yml (sekcja "worlds"),
#  ktory wskazuje na ten generator.
#
#  Gdy obecny jest DimensionManager, moze on nadpisac te wartosci
#  per-swiat przez API. Wtedy config.properties sluzy jako fallback.
# ============================================================

# --- Biom (Biome enum z Bukkit 1.7.10, np. OCEAN, DESERT, MUSHROOM_ISLAND) ---
biome=OCEAN

# --- Pogoda i czas ---
allowPrecipitation=false
enableDayNightCycle=false

# --- Spawn mobow (pasywne / agresywne / neutralne) ---
allowPassiveMobs=false
allowHostileMobs=false
allowNeutralMobs=false

# --- Platforma spawnu ---
platformEnabled=true
platformY=64
platformChunkRadius=1
platformMainBlock=STONE
platformBorderBlock=BEDROCK
# Dostepne: SPAWN_MARKER, RING, FULL, NONE
platformPattern=SPAWN_MARKER

# --- Punkt spawnu gracza (nad platforma) ---
spawnEnabled=true
spawnX=0.5
spawnY=65.0
spawnZ=0.5
spawnYaw=0.0
spawnPitch=0.02