# ============================================================
#  VoidChunkGenerator - default settings.
#  All keys use kebab-case. Applied to every void world.
#
#  When DimensionManager registers a per-world override through
#  the API, that override takes precedence for the specific world.
# ============================================================

# Biome applied to every generated chunk.
# See org.bukkit.block.Biome for valid values.
biome=OCEAN

# Platform generation.
platform-enabled=true
platform-y=64
platform-chunk-radius=1
platform-main-block=STONE
platform-border-block=BEDROCK
# Valid values: SPAWN_MARKER, RING, FULL, NONE
platform-pattern=SPAWN_MARKER

# Fixed spawn point (above the platform by default).
spawn-enabled=true
spawn-x=0.5
spawn-y=65.0
spawn-z=0.5
spawn-yaw=0.0
spawn-pitch=0.0